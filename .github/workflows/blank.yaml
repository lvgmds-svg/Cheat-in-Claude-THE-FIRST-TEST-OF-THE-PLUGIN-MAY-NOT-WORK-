name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q HL2Launcher-0.0.1.zip -d src
      - name: Build
        run: cd src/HL2Launcher && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HL2Launcher-apk
          path: src/HL2Launcher/app/build/outputs/apk/debug/*.apk
